<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
   <style>
      body, html {
        height: 100%;
        margin: 0;
      }
      .bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("https://media.gettyimages.com/id/171306436/photo/red-brick-high-school-building-exterior.jpg?s=612x612&w=gi&k=20&c=8to_zwGxxcI1iYcix7DhmWahoDTlaqxEMzumDwJtxeg=") no-repeat center center/cover;
        filter: blur(6px);
        z-index: -1;
      }
      .container {
        position: relative;
        z-index: 1; /* keep content above the blur */
        color: white;
        text-shadow: 0 0 10px black;
      }
    </style>
  <body>
  <div class="bg"></div> 
     <div class="container my-3">
     <h1 class="text-center mb-3">Welcome to our Application</h1>
     <center>
     <a class="btn btn-primary" href="/students" style="font-style:italic;color:purple;">Students</a>
     </center>
     </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
